name: Keepalive

# GitHub Actions はリポジトリへのプッシュがない状態が 60 日続くと
# スケジュールワークフローを自動で無効化する。
# このワークフローは 45 日ごとに空コミットを作成してリポジトリをアクティブに保つ。
on:
  schedule:
    - cron: '0 0 1,16 * *'  # 毎月1日・16日 (約15日間隔) の 00:00 UTC に実行
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Keep workflows active
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          # 最終コミットから何日経過したら空コミットを作成するか
          time_elapsed: 45
          commit_message: "chore: keepalive [skip ci]"
