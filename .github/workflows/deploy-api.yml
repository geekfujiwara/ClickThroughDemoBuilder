name: Deploy API (Function App)

# ローカル(コーポレート網)からの大容量デプロイが接続リセットされるため、
# Function App(Flex Consumption) へのデプロイは GitHub Actions から行う。
# Storage は Private Endpoint 経由でのみ到達可能だが、Function App の publish
# エンドポイントは公開のため runner から到達できる。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build API
        working-directory: api
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm prune --omit=dev

      - name: Azure Login
        uses: azure/login@v2
        id: azure_login
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      # GitHub Secrets を Function App のアプリ設定へ反映する。
      # - 値はシェルに直書きせず env 経由で渡す (インジェクション/特殊文字対策)。
      # - 未設定のシークレットはスキップし、既存値を空で上書きしない。
      # - ARM 書込に MFA が必要な環境ではこのステップが失敗し得るため continue-on-error。
      - name: Set Function App application settings
        if: steps.azure_login.outcome == 'success'
        continue-on-error: true
        env:
          APPROVAL_SECRET: ${{ secrets.APPROVAL_SECRET }}
          ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
        run: |
          SETTINGS=()
          if [ -n "$APPROVAL_SECRET" ]; then SETTINGS+=("APPROVAL_SECRET=$APPROVAL_SECRET"); fi
          if [ -n "$ENTRA_TENANT_ID" ]; then SETTINGS+=("ENTRA_TENANT_ID=$ENTRA_TENANT_ID"); fi
          if [ ${#SETTINGS[@]} -gt 0 ]; then
            az functionapp config appsettings set \
              --name func-clickthrough-prod \
              --resource-group rg-clickthrough-prod \
              --settings "${SETTINGS[@]}"
          else
            echo "No APPROVAL_SECRET/ENTRA_TENANT_ID secrets provided; skipping."
          fi

      - name: Align Function App runtime with build
        run: |
          APP_ID=$(az functionapp show \
            --name func-clickthrough-prod \
            --resource-group rg-clickthrough-prod \
            --query id --output tsv)
          CONFIG=$(az rest --method get \
            --uri "$APP_ID?api-version=2024-04-01" \
            --query properties.functionAppConfig --output json)
          BODY=$(jq -n --argjson config "$CONFIG" \
            '{properties: {functionAppConfig: ($config | .runtime.version = "22")}}')
          az rest --method patch \
            --uri "$APP_ID?api-version=2024-04-01" \
            --body "$BODY" --output none

      - name: Use managed identity for timer storage
        run: |
          ACCOUNT=$(az functionapp config appsettings list \
            --name func-clickthrough-prod \
            --resource-group rg-clickthrough-prod \
            --query "[?name=='AzureWebJobsStorage__accountName'].value | [0]" --output tsv)
          if [ -z "$ACCOUNT" ]; then
            echo "::error::AzureWebJobsStorage__accountName must be configured before enabling video cuts."
            exit 1
          fi
          az functionapp config appsettings delete \
            --name func-clickthrough-prod \
            --resource-group rg-clickthrough-prod \
            --setting-names AzureWebJobsStorage \
            --output none

      - name: Deploy to Function App
        uses: Azure/functions-action@v1
        with:
          app-name: func-clickthrough-prod
          package: api
