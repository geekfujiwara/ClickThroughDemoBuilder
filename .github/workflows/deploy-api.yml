name: Deploy API (Function App)

# ローカル(コーポレート網)からの大容量デプロイが接続リセットされるため、
# Function App(Flex Consumption) へのデプロイは GitHub Actions から行う。
# Storage は Private Endpoint 経由でのみ到達可能だが、Function App の publish
# エンドポイントは公開のため runner から到達できる。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build API
        working-directory: api
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm prune --omit=dev

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: Deploy to Function App
        uses: Azure/functions-action@v1
        with:
          app-name: func-clickthrough-prod
          package: api
