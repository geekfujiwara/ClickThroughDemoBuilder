name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_ENTRA_CLIENT_ID: ${{ secrets.VITE_ENTRA_CLIENT_ID }}
          VITE_APPINSIGHTS_CONNECTION_STRING: ${{ secrets.APPINSIGHTS_CONNECTION_STRING }}

      - name: Copy SWA config to dist
        run: cp staticwebapp.config.json dist/staticwebapp.config.json

      - name: Install API dependencies
        run: cd api && npm ci

      - name: Build API
        run: cd api && npm run build

      - name: Prepare API deployment folder
        run: |
          rm -rf api-deploy/dist
          mkdir -p api-deploy
          cp -r api/dist api-deploy/
          cp api/host.json api-deploy/
          cp api/package.json api-deploy/
          cp api/package-lock.json api-deploy/
          cd api-deploy && npm ci --production --ignore-scripts

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist"
          api_location: "api-deploy"
          output_location: ""
          skip_app_build: true
          skip_api_build: true

      - name: Azure Login
        uses: azure/login@v2
        continue-on-error: true
        id: azure_login
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: Set SWA application settings
        if: steps.azure_login.outcome == 'success'
        continue-on-error: true
        run: |
          az staticwebapp appsettings set \
            --name swa-clickthrough-prod \
            --resource-group rg-clickthrough-prod \
            --setting-names \
              GUEST_LOGIN_ID="${{ secrets.GUEST_LOGIN_ID }}" \
              GUEST_LOGIN_PASSWORD="${{ secrets.GUEST_LOGIN_PASSWORD }}"

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close PR Environment
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
