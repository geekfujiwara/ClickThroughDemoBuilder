name: Manage Storage Network Access

# スケジュール (JST):
#   03:00 (18:00 UTC) → Enabled/Allow に復元（業務開始前）
#   02:00 (17:00 UTC) → Disabled/Deny に設定（会社ポリシー検知時間帯に先に閉じる）
# ※ 会社ポリシーは深夜帯に実行されるため、02:00〜03:00 の1時間のみ Disabled にする
on:
  schedule:
    - cron: '0 18 * * *'  # 03:00 JST → Enabled
    - cron: '0 17 * * *'  # 02:00 JST → Disabled
  workflow_dispatch:
    inputs:
      action:
        description: '実行するアクション'
        required: true
        default: 'enable'
        type: choice
        options:
          - enable
          - disable

jobs:
  manage-network-access:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: Determine action
        id: action
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ inputs.action }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 12 * * *" ]; then
            echo "target=disable" >> $GITHUB_OUTPUT
          else
            echo "target=enable" >> $GITHUB_OUTPUT
          fi

      - name: Enable storage network access (04:00 JST)
        if: steps.action.outputs.target == 'enable'
        run: |
          echo "▶ publicNetworkAccess=Enabled / defaultAction=Allow に設定します..."
          az storage account update \
            --name stclickthroughprod \
            --resource-group rg-clickthrough-prod \
            --public-network-access Enabled \
            --default-action Allow
          echo "✓ 完了"

      - name: Disable storage network access (21:00 JST)
        if: steps.action.outputs.target == 'disable'
        run: |
          echo "▶ publicNetworkAccess=Disabled / defaultAction=Deny に設定します..."
          az storage account update \
            --name stclickthroughprod \
            --resource-group rg-clickthrough-prod \
            --public-network-access Disabled \
            --default-action Deny
          echo "✓ 完了"

      - name: Verify settings
        run: |
          az storage account show \
            --name stclickthroughprod \
            --resource-group rg-clickthrough-prod \
            --query "{publicNetworkAccess:publicNetworkAccess, defaultAction:networkRuleSet.defaultAction, allowSharedKeyAccess:allowSharedKeyAccess}" \
            -o table
