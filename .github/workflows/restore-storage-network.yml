name: Restore Storage Network Access

# 毎朝 4:00 JST (19:00 UTC) に実行
# 会社ポリシーが夜間に publicNetworkAccess=Disabled に変更するため、毎朝 Enabled に戻す
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:  # 手動実行も可能

jobs:
  restore-network-access:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: Restore storage network settings
        run: |
          echo "現在の設定を確認..."
          CURRENT_PUBLIC=$(az storage account show \
            --name stclickthroughprod \
            --resource-group rg-clickthrough-prod \
            --query "publicNetworkAccess" -o tsv)
          CURRENT_DEFAULT=$(az storage account show \
            --name stclickthroughprod \
            --resource-group rg-clickthrough-prod \
            --query "networkRuleSet.defaultAction" -o tsv)
          echo "publicNetworkAccess: $CURRENT_PUBLIC"
          echo "defaultAction: $CURRENT_DEFAULT"

          NEEDS_UPDATE=false

          if [ "$CURRENT_PUBLIC" != "Enabled" ]; then
            echo "⚠ publicNetworkAccess が Enabled ではありません ($CURRENT_PUBLIC)"
            NEEDS_UPDATE=true
          fi
          if [ "$CURRENT_DEFAULT" != "Allow" ]; then
            echo "⚠ defaultAction が Allow ではありません ($CURRENT_DEFAULT)"
            NEEDS_UPDATE=true
          fi

          if [ "$NEEDS_UPDATE" = "true" ]; then
            echo "設定を復元します..."
            az storage account update \
              --name stclickthroughprod \
              --resource-group rg-clickthrough-prod \
              --public-network-access Enabled \
              --default-action Allow
            echo "✓ 復元完了"
          else
            echo "✓ 設定は正常です。変更不要。"
          fi

      - name: Verify settings
        run: |
          az storage account show \
            --name stclickthroughprod \
            --resource-group rg-clickthrough-prod \
            --query "{publicNetworkAccess:publicNetworkAccess, defaultAction:networkRuleSet.defaultAction, allowSharedKeyAccess:allowSharedKeyAccess}" \
            -o table
