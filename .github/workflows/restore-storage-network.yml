name: Manage Storage Network Access

# スケジュール (JST):
#   04:00〜20:00 の毎時 → Enabled/Allow に復元（自己回復）
#   21:00 (12:00 UTC)  → Disabled/Deny に設定（会社ポリシー検知時間帯に合わせて先に閉じる）
#
# ⚠ 重要: enable を「毎時」実行するのは単一障害点を無くすため。
#   GitHub Actions のスケジュールは高負荷帯で遅延・スキップされることがあり、
#   1 日 1 回の cron では 1 回のスキップで終日 Private のままになる。
#   営業時間中は毎時 enable を試行し、スキップされても次の正時に自己回復させる。
#   (enable は冪等なので何度実行しても副作用はない)
on:
  schedule:
    # 04:00〜20:00 JST の毎時 = 19-23 UTC と 00-11 UTC (12 UTC=disable を除く)。
    # 分は 15 分オフセットして GitHub の「正時0分」高負荷スキップを回避。
    - cron: '15 0-11,19-23 * * *'  # 04:00〜20:00 JST → Enabled (毎時・自己回復)
    - cron: '15 12 * * *'          # 21:00 JST       → Disabled
  workflow_dispatch:
    inputs:
      action:
        description: '実行するアクション'
        required: true
        default: 'enable'
        type: choice
        options:
          - enable
          - disable

jobs:
  manage-network-access:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: Determine action
        id: action
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ inputs.action }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "15 12 * * *" ]; then
            echo "target=disable" >> $GITHUB_OUTPUT
          else
            echo "target=enable" >> $GITHUB_OUTPUT
          fi

      - name: Enable storage network access (04:00〜20:00 JST)
        if: steps.action.outputs.target == 'enable'
        run: |
          # 会社の Azure Policy が publicNetworkAccess=Disabled を強制しているため、
          # --public-network-access Enabled は反映されない（Disabled のまま戻される）。
          # publicNetworkAccess=Disabled 環境で Functions(信頼済み Azure サービス)を
          # 通すには networkRuleSet.bypass=AzureServices が必須。これを確実に維持する。
          echo "▶ bypass=AzureServices / defaultAction=Allow を設定 (+ publicNetworkAccess=Enabled も試行)..."
          for i in 1 2 3; do
            # まず bypass を必ず設定（これが Disabled 環境での実効的なアクセス経路）
            if az storage account update \
              --name stclickthroughprod \
              --resource-group rg-clickthrough-prod \
              --bypass AzureServices \
              --default-action Allow; then
              # publicNetworkAccess=Enabled はポリシーで拒否/巻き戻される場合があるため
              # 失敗しても無視する（bypass 設定が成功していれば OK）
              az storage account update \
                --name stclickthroughprod \
                --resource-group rg-clickthrough-prod \
                --public-network-access Enabled || echo "ℹ publicNetworkAccess=Enabled はポリシーにより反映されない可能性があります（想定内）"
              echo "✓ 完了 (試行 $i 回目)"
              exit 0
            fi
            echo "⚠ 試行 $i 回目失敗。再試行します..."
            sleep 10
          done
          echo "✗ enable に 3 回失敗しました"
          exit 1

      - name: Disable storage network access (21:00 JST)
        if: steps.action.outputs.target == 'disable'
        run: |
          echo "▶ publicNetworkAccess=Disabled / defaultAction=Deny に設定します..."
          az storage account update \
            --name stclickthroughprod \
            --resource-group rg-clickthrough-prod \
            --public-network-access Disabled \
            --default-action Deny
          echo "✓ 完了"

      - name: Verify settings
        run: |
          echo "===== 概要 ====="
          az storage account show \
            --name stclickthroughprod \
            --resource-group rg-clickthrough-prod \
            --query "{publicNetworkAccess:publicNetworkAccess, defaultAction:networkRuleSet.defaultAction, bypass:networkRuleSet.bypass, allowSharedKeyAccess:allowSharedKeyAccess}" \
            -o table
          echo "===== networkRuleSet 詳細 (bypass / resourceAccessRules / privateEndpoint) ====="
          az storage account show \
            --name stclickthroughprod \
            --resource-group rg-clickthrough-prod \
            --query "{networkRuleSet:networkRuleSet, privateEndpointConnections:privateEndpointConnections}" \
            -o json
